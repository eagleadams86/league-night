<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- frame-src 'self' is what lets the hidden iframe below load index.html.
     Without it the frame is refused by default-src and the suite reports that
     the app exposed no hooks — which reads as an app bug and is a CSP one. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Night — Tests</title>
<style>
  /* Dev-only page. Colours are Midnight from the theme pack, HARD-CODED on
     purpose: this page must keep working when theme.css is the thing that
     broke, so it is the one file here that does not link it. */
  body { background: #0a0e1a; color: #e7eaf6; margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #838cab; font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid #262f4a; background: #121829; }
  #summary.ok  { color: #72fe84; border-color: #72fe84; }
  #summary.bad { color: #fb7874; border-color: #fb7874; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid #262f4a; vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: #72fe84; }
  tr.fail td.st { color: #fb7874; }
  tr.fail td.msg { color: #fb7874; }
  .msg { color: #838cab; font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: #838cab; border-bottom-color: #374163; }
</style>
</head>
<body>
<div class="wrap">
  <h1>League Night — Tests</h1>
  <p class="sub">Loads the real index.html in a hidden iframe and calls its functions directly
    — no copies, no build step, so a test cannot drift from the code it tests. Read-only:
    nothing here writes to storage.</p>
  <div id="summary">Loading…</div>
  <table><tbody id="out"></tbody></table>
</div>

<script>
'use strict';

/* ── The completeness floor ────────────────────────────────────────────────
   Every tests.html in this family pins the number of tests it expects to RUN.
   Removing a test fails the build; adding one never does. Without it, tests that
   go MISSING look exactly like tests that pass — a suite that quietly shrank to
   three checks still says "all 3 tests pass". RAISE THIS when you add tests, and
   lower it only when you retire one deliberately. */
const EXPECTED = 251;

/* ── It refuses to run anywhere but localhost, and that is load-bearing ──────
   GitHub Pages publishes this page BESIDE the app, where the iframe below would
   be the reader's real, saved copy — and booting the app IS the side effect, so
   the check cannot live in the load handler. `file://` is deliberately NOT in
   this list: it has no hostname, and treating '' as local sends the page down
   the iframe branch, where the frame silently fails to load and the suite blames
   the app for what is a setup problem. */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

/* Bust the frame AND the source fetches. They are different caches and they can
   disagree: in the lottery repo this same harness once reported ALL GREEN
   against a page three features out of date, because the source-level tests read
   the file off the server while the frame ran a copy the browser had cached.
   Nothing errored; the new code was simply never run. A suite that can pass
   against a build which exists nowhere is worse than no suite — it turns
   "untested" into "verified". */
const BUST = '?t=' + Date.now();
const bustFetch = (path) => fetch(path + BUST, { cache: 'no-store' });

const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name: name, fn: fn }); }
/* `detail` is the value that FAILED, not more prose: `ok(w <= pin, 'it fits',
   w + 'px')` says what was expected and then shows what was actually there.
   Every suite in the family takes three arguments now (2026-08-26). It was two
   here, and a call site passing a third had its diagnostic silently dropped —
   the assertion still failed correctly, it just refused to say what it saw.
   CodeQL's js/superfluous-trailing-arguments caught it three separate times in
   one day, in three different repos, which is what settled the signature. */
function ok(cond, note, detail) {
  if (cond) return;
  throw new Error((note || 'expected truthy')
    + (detail === undefined ? '' : ' \u2014 got ' + detail));
}
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((note ? note + ' — ' : '') + 'got ' + a + ', wanted ' + b);
}
/* A loop, not a single .replace(): one pass over a multi-character delimiter can
   leave a NEW opener behind that the pass has already gone past. CodeQL flags the
   single-pass version and it was open on five of the nine public repos at once.
   Nothing here renders what it strips — the reason to fix it is that a helper
   which can be fooled about what is commented out is one that can miss a live
   off-origin script, which is what these suites exist to catch. */
/* The text a READER sees, tags removed. Deliberately a scanner and not
   `replace(/<[^>]+>/g, '')`: a single-pass tag strip is the shape CodeQL flags as
   incomplete multi-character sanitization, and it is right to — one pass over
   `<<p>p>` leaves a live tag behind. Nothing here is rendered, so the bug that
   shape would cause here is only a wrong CHARACTER COUNT, but the alert it raises
   is a real High sitting open on the security tab, where a true finding would be
   missed among it. Callers normalise whitespace themselves, as they did before. */
function visibleText(html) {
  let out = '', inTag = false;
  for (const ch of html) {
    if (ch === '<') { inTag = true; continue; }
    if (ch === '>') { inTag = false; continue; }
    if (!inTag) out += ch;
  }
  return out;
}

function stripComments(src) {
  let out = src, prev;
  do { prev = out; out = out.replace(/\/\*[\s\S]*?\*\//g, '').replace(/<!--[\s\S]*?-->/g, ''); }
  while (out !== prev);
  return out;
}

let W = null, H = null;
let APP_SRC = '', PRIVACY_SRC = '', THEME_SRC = '', SW_SRC = '', KILL_SRC = '', MANIFEST_SRC = '', RULES_SRC = '', README_SRC = '';

async function main() {
  if (LOCAL_HOSTS.indexOf(location.hostname) === -1) {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'This suite only runs on http://localhost — it boots the real app in a '
      + 'frame, which must never happen on the published site. Serve this folder and open '
      + 'http://localhost:<port>/tests.html';
    return;
  }

  APP_SRC      = await (await bustFetch('index.html')).text();
  PRIVACY_SRC  = await (await bustFetch('privacy.html')).text();
  THEME_SRC    = await (await bustFetch('theme.css')).text();
  SW_SRC       = await (await bustFetch('sw.js')).text();
  KILL_SRC     = await (await bustFetch('sw-kill.js')).text();
  MANIFEST_SRC = await (await bustFetch('manifest.webmanifest')).text();
  RULES_SRC    = await (await bustFetch('firestore.rules')).text();
  README_SRC   = await (await bustFetch('README.md')).text();

  /* ── Guard the source actually loaded, BEFORE any negative assertion ───────
     An all-NOT test over a fetched file proves nothing when the fetch failed:
     every "must not contain" passes on an empty string, and the suite goes green
     having read nothing. */
  ok(APP_SRC.length > 2000, 'index.html did not load — every check below would pass on an empty string');
  ok(PRIVACY_SRC.length > 500, 'privacy.html did not load');
  ok(THEME_SRC.length > 2000, 'theme.css did not load — is it beside these files?');
  ok(SW_SRC.length > 500, 'sw.js did not load');
  ok(KILL_SRC.length > 100, 'sw-kill.js did not load — the escape hatch has to exist BEFORE it is needed');
  ok(MANIFEST_SRC.length > 100, 'manifest.webmanifest did not load');
  ok(RULES_SRC.length > 500, 'firestore.rules did not load');
  ok(README_SRC.length > 2000, 'README.md did not load — the runbook checks below would pass on an empty string');

  W = await bootApp();
  H = W.__lnTestHooks;
  define();
  await runAsync();
  run();
}

function bootApp() {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe');
    frame.title = 'app under test';
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('data-ln-tests', '');
    frame.style.cssText = 'position:absolute;width:1000px;height:800px;left:-9999px;top:0';
    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      /* Wrapped: reading a property of a frame the CSP refused throws a
         SecurityError, and an uncaught one here never reaches the catch below —
         the suite then sits on "Loading…" saying nothing at all. */
      let hooks = null;
      try { hooks = win && win.__lnTestHooks; } catch (e) { hooks = null; }
      if (hooks) { resolve(win); return; }
      let booted = false, blocked = false;
      try { booted = !!(win.document && win.document.getElementById('standingsWrap')); }
      catch (e) { blocked = true; }
      reject(new Error(blocked
        ? 'the frame could not be read at all — this page’s CSP needs frame-src \'self\'.'
        : booted
          ? 'index.html loaded but exposed no __lnTestHooks — did something throw while '
            + 'it was starting up? Check the browser console.'
          : 'The hidden frame never loaded index.html — is it being served?'));
    }, { once: true });
    frame.src = 'index.html' + BUST;   /* set before append: one load event, the real one */
    document.body.appendChild(frame);
  });
}

/* ── A SECOND frame, booted as somebody else's snapshot ──────────────────────
   The only honest way to test a shared view: `viewOnly` is decided from the
   URL before anything renders and there is no hook that flips it — a flag a
   test can set is a flag a bug can set. So this boots the real app at a real
   '#share=' link, and polls for the banner because `load` fires before boot()
   has awaited decodeShare(). */
function bootFrame(hash, width, height) {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe');
    frame.title = 'app under test, ' + (hash ? 'as a shared snapshot' : 'at ' + width + 'px');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('data-ln-tests', '');
    frame.style.cssText = 'position:absolute;width:' + (width || 1000) + 'px;height:' + (height || 800) + 'px;left:-9999px;top:0';
    frame.src = 'index.html' + BUST + (hash || '');
    document.body.appendChild(frame);
    const started = Date.now();
    const poll = () => {
      let win = null, ready = false;
      try {
        win = frame.contentWindow;
        if (hash && hash.indexOf('#share=') === 0) { const bar = win.document.getElementById('viewbar'); ready = !!(win.lnViewOnly && bar && !bar.hidden); }
        else ready = !!win.__lnTestHooks;
      } catch (e) { /* not readable yet */ }
      if (ready) { resolve(win); return; }
      if (Date.now() - started > 15000) { reject(new Error('the frame never finished booting')); return; }
      setTimeout(poll, 40);
    };
    poll();
  });
}

/* The async checks run up front and their VERDICTS are recorded, so a test
   body stays a plain function that either throws or doesn't. */
const asyncResults = {};
async function runAsync() {
  /* ── The render smoke test ─────────────────────────────────────────────
     Plant each demo league, visit every tab, open and close every dialog,
     and record anything the frame throws. It cannot tell a right figure from
     a wrong one; it is the difference between "the maths is right" and "the
     app runs". */
  try {
    const errs = [];
    W.addEventListener('error', (e) => errs.push(String(e.message)));
    W.addEventListener('unhandledrejection', (e) => errs.push('unhandled rejection: ' + e.reason));
    const drawn = {};
    const doc = W.document;
    const walk = (prefix) => {
      for (const tab of H.TABS) {
        const btn = doc.getElementById('tab-' + tab);
        if (!btn) { errs.push('no tab button for ' + tab); continue; }
        btn.click();
        const panel = doc.getElementById(btn.getAttribute('aria-controls'));
        drawn[prefix + tab] = panel ? panel.textContent.trim().length : 0;
      }
    };
    H.__plant(H.buildDemoSingles());
    walk('tab:');
    /* The scorer, the player editor and the bracket builder fill themselves
       from a record, so open each on one before the blind open/close pass. */
    doc.getElementById('tab-matches').click();
    doc.querySelector('#matchesWrap .mrow').click(); doc.getElementById('matchDialog').close();
    doc.getElementById('tab-players').click();
    doc.querySelector('#playersWrap .prow').click(); doc.getElementById('playerDialog').close();
    doc.getElementById('tab-tournament').click();
    doc.getElementById('addBracketBtn').click(); doc.getElementById('bracketDialog').close();
    doc.getElementById('scheduleBtn').hidden || (doc.getElementById('scheduleBtn').click(), doc.getElementById('scheduleDialog').close());
    doc.getElementById('shareBtn').click(); doc.getElementById('shareDialog').close();
    doc.getElementById('tab-' + H.TABS[0]).click();
    const dialogs = [...doc.querySelectorAll('dialog')].filter((d) => d.id);
    for (const d of dialogs) {
      try { d.showModal(); drawn['dialog:' + d.id] = d.textContent.trim().length; d.close(); }
      catch (e) { errs.push('dialog ' + d.id + ': ' + e.message); }
    }
    H.__plant(H.buildDemoTeams());
    walk('teams:');
    doc.getElementById('tab-matches').click();
    doc.querySelector('#matchesWrap .mrow').click();
    /* The card only exists in a TEAM league, and only inside this window. */
    drawn['teams:lineup'] = doc.getElementById('mtLineup').textContent.trim().length;
    doc.getElementById('matchDialog').close();
    doc.getElementById('tab-standings').click();
    doc.querySelector('#stModeWrap [data-mode="players"]').click();
    drawn['teams:individual'] = doc.getElementById('standingsWrap').textContent.trim().length;
    doc.querySelector('#stModeWrap [data-mode="sides"]').click();
    doc.getElementById('tab-players').click();
    doc.querySelector('#teamsWrap .prow').click(); doc.getElementById('teamDialog').close();
    asyncResults.smoke = { errs: errs, drawn: drawn, dialogs: dialogs.length };
  } catch (e) { asyncResults.smoke = { errs: ['the walk itself threw: ' + e.message], drawn: {}, dialogs: 0 }; }
  try { H.__plant(FIXTURE); W.setTab('standings'); } catch (e) { /* reported by the walk's own verdict */ }

  try {
    const payload = H.buildSharePayload(H.normalizeLeague(FIXTURE), {});
    const token = await H.encodeShare(payload);
    asyncResults.roundTrip = { token: token, back: await H.decodeShare(token) };
  } catch (e) { asyncResults.roundTrip = { error: e.message }; }
  try { await H.decodeShare('9.AAAA'); asyncResults.badMarker = 'no error'; } catch (e) { asyncResults.badMarker = e.message; }
  try {
    await H.decodeShare(await H.encodeShare({ v: H.SHARE_PAYLOAD_V + 1, league: {}, matches: [] }));
    asyncResults.newer = { thrown: false };
  } catch (e) { asyncResults.newer = { thrown: true, flagged: !!e.newerVersion }; }

  /* ── The shared view, in a frame of its own ───────────────────────────── */
  try {
    const S = await bootFrame('#share=' + await H.encodeShare(H.buildSharePayload(H.normalizeLeague(FIXTURE), {})));
    const SD = S.document;
    SD.getElementById('tab-matches').click();
    asyncResults.shared = {
      banner: !SD.getElementById('viewbar').hidden,
      readonly: SD.documentElement.hasAttribute('data-readonly'),
      leagueId: S.__lnTestHooks.__state().league.id,
      noAddMatch: SD.getElementById('addMatchBtn').hidden,
      noScore: !SD.querySelector('.mrow .mgo'),
      rows: (SD.getElementById('tab-standings').click(), SD.querySelectorAll('#standingsTable tbody tr').length),
      /* Every button on the League tab that a reader could press. */
      leagueButtons: (SD.getElementById('tab-league').click(), [...SD.querySelectorAll('#leaguePanel button')]
        .filter((b) => !b.classList.contains('tile-help') && !b.disabled && b.getClientRects().length).map((b) => b.id || b.textContent.trim())),
    };
  } catch (e) { asyncResults.shared = { error: e.message }; }

  /* ── A phone-sized frame: the bar, the sheet, no sideways scroll ────────
     Measured in a 375x812 frame, because a media query answers the frame it
     is in and nothing about the bar can be seen at 1000px. */
  try {
    const P = await bootFrame('', 375, 812);
    const PD = P.document;
    P.__lnTestHooks.__plant(P.__lnTestHooks.buildDemoSingles());
    const bar = PD.querySelector('.tabbar');
    const r = {
      vw: P.innerWidth, vh: P.innerHeight,
      barDisplay: P.getComputedStyle(bar).display,
      /* THE ROW, not the tablist inside it: hiding only the tabs would leave
         the pin button standing where they were. */
      tabrowDisplay: P.getComputedStyle(PD.querySelector('.tabrow')).display,
      barBottom: Math.round(bar.getBoundingClientRect().bottom),
      padBottom: parseFloat(P.getComputedStyle(PD.body).paddingBottom),
    };
    /* ── The phone header: the name above, the controls on one scrolling line
       (2026-09-08). Measured here rather than asserted from the CSS, because
       what was wrong before was the HEIGHT of a wrapped row and only a real
       frame has one. */
    {
      const head = PD.querySelector('header');
      const ctl = PD.querySelector('.headctl');
      const brand = PD.querySelector('.brand');
      /* Two kinds of child are out. The .sr-only labels are absolutely
         positioned and sit nowhere near the controls they name, so a gap
         measured through one is a number about nothing. And anything not
         RENDERED — the sync button is hidden with no cloud config, which is
         every harness run — returns an all-zero rectangle, whose top of 0 reads
         as a second line the row has not got. */
      const kids = [...ctl.children].filter((e) =>
        !e.classList.contains('sr-only') && e.getClientRects().length);
      const gaps = [];
      for (let i = 1; i < kids.length; i++) {
        gaps.push(Math.round(kids[i].getBoundingClientRect().left - kids[i - 1].getBoundingClientRect().right));
      }
      r.headerPos = P.getComputedStyle(head).position;
      r.headerH = Math.round(head.getBoundingClientRect().height);
      r.brandLeft = Math.round(brand.getBoundingClientRect().left);
      r.ctlTop = Math.round(ctl.getBoundingClientRect().top);
      r.brandBottom = Math.round(brand.getBoundingClientRect().bottom);
      r.ctlOverflowX = P.getComputedStyle(ctl).overflowX;
      r.ctlWrap = P.getComputedStyle(ctl).flexWrap;
      r.ctlScrolls = ctl.scrollWidth > ctl.clientWidth;
      r.ctlGaps = gaps;
      /* One line: every control shares a top. */
      r.ctlLines = new Set(kids.map((e) => Math.round(e.getBoundingClientRect().top))).size;
      /* The 📌 is not on a phone at all, so it cannot be reached by a Tab. */
      r.pinRects = PD.getElementById('pinBtn').getClientRects().length;
      r.pinStuck = P.__lnTestHooks.pin.stuck();
    }
    PD.getElementById('tab-matches').click();
    PD.querySelector('#matchesWrap .mrow').click();
    r.sheetW = Math.round(PD.getElementById('matchDialog').getBoundingClientRect().width);
    r.barUnderDialog = P.getComputedStyle(bar).display;
    PD.getElementById('matchDialog').close();
    ['standings', 'matches', 'players', 'tournament', 'league'].forEach((tab) => PD.getElementById('tab-' + tab).click());
    r.noSideways = PD.documentElement.scrollWidth <= P.innerWidth + 1;
    asyncResults.phone = r;
  } catch (e) { asyncResults.phone = { error: e.message }; }

  /* ── Arriving by a join link, with no cloud ─────────────────────────────── */
  try {
    const J = await bootFrame('#join=LN-ABCDEFGH&admin=ABCDEFGHJKLMNPQR');
    await new Promise((r) => setTimeout(r, 300));
    asyncResults.joinArrival = { hash: J.location.hash, toast: J.document.getElementById('toast').textContent };
  } catch (e) { asyncResults.joinArrival = { error: e.message }; }

  /* ── Where a press leaves the page ─────────────────────────────────────── */
  try {
    const D = W.document;
    const pause = (ms) => new Promise((r) => setTimeout(r, ms));
    const settle = async (y) => { W.scrollTo(0, y); await pause(80); return W.scrollY; };
    const press = async (t) => { D.getElementById('tab-' + t).click(); await pause(120); };
    H.__plant(H.buildDemoSingles());
    await pause(150);
    await press('matches');
    const down = await settle(400);
    await press('players');
    const afterOtherTab = W.scrollY;
    await press('matches');
    const held = await settle(400);
    await press('matches');
    const afterSameTab = W.scrollY;
    asyncResults.landing = { down: down, afterOtherTab: afterOtherTab, held: held, afterSameTab: afterSameTab };
  } catch (e) { asyncResults.landing = { error: e.message }; }
  try { H.__plant(FIXTURE); W.setTab('standings'); } catch (e) { /* reported by the verdict above */ }
}

/* ── The suite plants what it needs, and never trusts what it finds ──────────
   A fixed league, not the demo: the demo's dates count back from today, so an
   assertion on an order would drift, and the point of a fixture is that it
   cannot. Four players, one season, three results and a fixture still to
   play — enough for a table to have something to say. */
const FIXTURE = {
  schema: 1,
  league: { id: 'LN-FIXTURE1', name: 'Fixture League', game: 'darts', createdAt: '2026-01-01', u: 1,
            settings: { format: 'singles', teamSize: 2, legFormat: '501', dOut: true,
                        matchFormat: { mode: 'bestOf', n: 3 }, points: { win: 2, draw: 1, loss: 0 },
                        tiebreak: ['pts', 'legDiff', 'legsFor', 'h2h', 'name'] } },
  players: [
    { id: 'fx-alpha', name: 'Alpha Thousands', teamId: null, hcp: null, active: true, u: 2 },
    { id: 'fx-bravo', name: 'Bravo Ordinary', teamId: null, hcp: 20, active: true, u: 3 },
    { id: 'fx-charlie', name: 'Charlie Negative', teamId: null, hcp: null, active: true, u: 4 },
    { id: 'fx-delta', name: 'Delta Retired', teamId: null, hcp: null, active: false, u: 5 },
  ],
  teams: [],
  seasons: [{ id: 'fx-season', name: 'Fixture Season', startsOn: '2026-01-05', status: 'active', u: 6 }],
  matches: [
    { id: 'fx-m1', seasonId: 'fx-season', bracketId: null, slot: null, round: 1, date: '2026-01-05', venue: 'The Crown',
      a: 'fx-alpha', b: 'fx-bravo', status: 'played', score: { a: 0, b: 0 },
      legs: [{ w: 'a', by: { a: ['fx-alpha'], b: ['fx-bravo'] }, start: { a: 501, b: 481 }, a: { darts: 18, checkout: 40 } },
             { w: 'a', by: { a: ['fx-alpha'], b: ['fx-bravo'] }, start: { a: 501, b: 481 }, a: { darts: 21, t180: 1 } }], u: 10 },
    { id: 'fx-m2', seasonId: 'fx-season', bracketId: null, slot: null, round: 1, date: '2026-01-05', venue: '',
      a: 'fx-charlie', b: 'fx-delta', status: 'played', score: { a: 0, b: 0 },
      legs: [{ w: 'b', by: { a: ['fx-charlie'], b: ['fx-delta'] }, start: { a: 501, b: 501 } },
             { w: 'a', by: { a: ['fx-charlie'], b: ['fx-delta'] }, start: { a: 501, b: 501 } },
             { w: 'b', by: { a: ['fx-charlie'], b: ['fx-delta'] }, start: { a: 501, b: 501 } }], u: 11 },
    { id: 'fx-m3', seasonId: 'fx-season', bracketId: null, slot: null, round: 2, date: '2026-01-12', venue: '',
      a: 'fx-alpha', b: 'fx-charlie', status: 'forfeit', score: { a: 2, b: 0 }, legs: [], u: 12 },
    { id: 'fx-m4', seasonId: 'fx-season', bracketId: null, slot: null, round: 2, date: '2026-01-12', venue: '',
      a: 'fx-bravo', b: 'fx-delta', status: 'scheduled', score: { a: 0, b: 0 }, legs: [], u: 13 },
  ],
  brackets: [],
  tombstones: [],
};
const M = (id, a, b, sa, sb, date, extra) => Object.assign({ id: id, a: a, b: b, status: 'played', score: { a: sa, b: sb }, legs: [], date: date, u: 1,

    ok(/allow list:\s*if false;/.test(r), 'leagues are never enumerable — the ID is a capability only while nobody can list them');
    ok(/allow get:\s*if signedIn\(\);/.test(r), 'any signed-in account may fetch a league by id');
    ok(/request\.resource\.data\.rev == resource\.data\.rev \+ 1/.test(r), 'every update raises rev by exactly one');

       'and the owner may write their own admin record without a key — Share writes it, and the first published rules refused it');
    /* Every get() is guarded by an exists() on the same path. */
    /* A balanced-paren scan: get(memberPath(me())).data nests two deep. */
    const gets = [];
    for (let at = r.indexOf('get('); at !== -1; at = r.indexOf('get(', at + 4)) {
      if (/[\w.]/.test(r[at - 1] || '')) continue;
      let depth = 0, i = at + 3;
      for (; i < r.length; i++) { if (r[i] === '(') depth++; else if (r[i] === ')' && --depth === 0) break; }
      if (r.slice(i + 1, i + 6) === '.data') gets.push(r.slice(at + 4, i));
    }
    ok(gets.length >= 4, 'gets found: ' + gets.length);
    gets.forEach((p) => ok(r.indexOf('exists(' + p + ')') !== -1, 'unguarded get on ' + p));
    ok(!/match \/\{document=\*\*\}/.test(r), 'no catch-all');
  });

    const m = stripComments(mod);
    ok(/A\.initializeAuth\(app/.test(m) && !/A\.getAuth\(/.test(m), 'initializeAuth, never getAuth');

    ok(/initTokenClient/.test(m) && /signInWithCredential/.test(m), 'Google Identity Services, then the credential exchange');
    ok(/runTransaction\(db/.test(m) && /window\.lnMerge\(mine, cloud\.state\)/.test(m), 'a push is a transaction that merges');
    ok(/rev: cloud\.rev \+ 1/.test(m), 'and raises rev by one');

    ok(/writeBatch\(db\)/.test(m) && /batch\.delete\(leagueRef\(id\)\)/.test(m), 'deleting a league is one batch');

  t('the Reed–Solomon codewords have zero syndromes', () => {
    const data = H.qrCodewords(Array.from(new TextEncoder().encode('LN-7KQ4M2XR')), 1);
    const ec = H.rsEncode(data, 10);
    const poly = data.concat(ec);
    const evalAt = (p, x) => p.reduce((acc, c) => H.gfMul(acc, x) ^ c, 0);
    for (let i = 0; i < 10; i++) eq(evalAt(poly, H.GF_EXP[i]), 0, 'syndrome ' + i);
  });
  t('the symbol has the structure every reader relies on', () => {
    const M = H.qrMatrix('https://eagleadams86.github.io/league-night/#join=LN-7KQ4M2XR');
    const n = M.length;
    eq(n, 17 + 4 * M.version, 'size is 17 + 4v');
    ok(M.mask >= 0 && M.mask <= 7, 'a mask was chosen: ' + M.mask);
    const finder = (r0, c0) => { for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
      const want = r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
      if (M[r0 + r][c0 + c] !== want) return false; } return true; };
    ok(finder(0, 0) && finder(0, n - 7) && finder(n - 7, 0), 'three finders');
    for (let i = 8; i < n - 8; i++) { eq(M[6][i], i % 2 === 0, 'timing row'); eq(M[i][6], i % 2 === 0, 'timing column'); }
    ok(M[n - 8][8] === true, 'the dark module');
    /* Both format copies decode to level M and the chosen mask. */
    const read = (cells) => cells.reduce((v, [r, c]) => (v << 1) | (M[r][c] ? 1 : 0), 0);
    const tl = read([[8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8], [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]]);
    const other = read([[n - 1, 8], [n - 2, 8], [n - 3, 8], [n - 4, 8], [n - 5, 8], [n - 6, 8], [n - 7, 8], [8, n - 8], [8, n - 7], [8, n - 6], [8, n - 5], [8, n - 4], [8, n - 3], [8, n - 2], [8, n - 1]]);
    eq(tl, other, 'the two copies agree');
    const unmasked = tl ^ 0x5412;
    eq(unmasked >> 10, (0 << 3) | M.mask, 'and say level M and the mask');
  });

  t('the rules let a member say only what is theirs', () => {
    const R = RULES_SRC;
    ok(/match \/requests\/\{uid\}/.test(R), 'the requests subcollection has a rule at all');
    ok(/allow list:\s*if signedIn\(\) && \(memberIsAdmin\(\) \|\| isOwner\(\)\)/.test(R),
      'only somebody who could act on a request may list them');
    ok(/allow create, update: if signedIn\(\) && me\(\) == uid[\s\S]{0,120}exists\(memberPath\(me\(\)\)\)/.test(R),
      'only the member themselves, and only once they have actually joined');
    ok(/hasOnly\(\['at', 'playerId', 'name', 'teamId', 'teamName', 'claim'\]\)/.test(R), 'the key whitelist is exactly six');
    ok(/d\.name\.size\(\) <= 40/.test(R) && /d\.teamName\.size\(\) <= 40/.test(R), 'both names capped at 40');
    ok(/d\.playerId\.size\(\) <= 64/.test(R) && /d\.teamId\.size\(\) <= 64/.test(R), 'both ids capped at 64');
    ok(/hasOnly\(\['role', 'name', 'playerId', 'joinedAt', 'avail'\]\)/.test(R), 'a member document carries avail and nothing new besides');
    ok(/d\.avail\.size\(\) <= 40/.test(R) && /d\.avail\.values\(\)\.hasOnly\(\['y', 'n', 's'\]\)/.test(R),
      'availability is capped and can only be one of three answers');
    /* Every get() in this file is guarded — an unguarded one on a missing
       document is an evaluation ERROR, not false. */
    const gets = R.match(/get\(/g) || [];
    const exists = R.match(/exists\(/g) || [];
    ok(gets.length >= 4 && exists.length >= gets.length, 'every get() still has an exists() to guard it', exists.length + ' vs ' + gets.length);

    ok(/async function leaveLeague[\s\S]{0,400}deleteDoc\(requestRef\(id, user\.uid\)\)/.test(src), 'leaving takes yours');

  /* ── Team Setup ─────────────────────────────────────────────────────────
     A member who is not an admin may change something in the league itself,
     and only here. What the SERVER promises is narrower than what the UI

     season, bracket or setting moved" and cannot say which player. Both

  group('Team Setup: a member sorts the teams out, and nothing else');
  const cloudLeague = () => {
    const st = H.normalizeLeague(teamsFixture());
    H.__plant(st);
    const e = H.__device().leagues.find((l) => l.id === st.league.id);
    if (e) e.cloud = true;
    return H.__state();
  };
  const asMember = (st, opts) => {
    const o = opts || {};
    W.lnCloudUser({ uid: 'u1', name: 'One', email: 'o@x' });
    W.lnRoster(st.league.id, o.claimed === false ? [] : [{ playerId: 'p1', uid: 'u1' }]);
    W.lnMembers(st.league.id, [{ uid: 'u1', name: 'One', role: 'viewer', playerId: o.claimed === false ? null : 'p1', avail: null }]);
    W.lnMe({ role: 'viewer', name: 'One', playerId: o.claimed === false ? null : 'p1' });
    W.lnSetup(st.league.id, o.setup !== false);
    H.__setRole('viewer');
  };
  const restore = () => {
    try { W.lnSetup('', false); W.lnRoster('', []); W.lnMembers('', []); W.lnMe(null); W.lnCloudUser(null); } catch (e) {}
    H.__setRole('owner');
    H.__plant(FIXTURE);
  };

  t('the setup flag is a field on the league document, and absent means off', () => {
    const R = RULES_SRC;

    ok(/\(!\('setup' in d\) \|\| d\.setup is bool\)/.test(R), 'and it validates when it is there');
    ok(/hasAll\(\['state', 'rev', 'owner', 'game', 'name', 'schema', 'updatedAt'\]\)/.test(R),
      'validLeague is hasAll and NOT hasOnly — which is what lets an old league validate with no setup key');
    ok(!/keys\(\)\.hasOnly\(\['state', 'rev', 'owner'/.test(R), 'and it never became hasOnly');
  });

  t('the member clause pins three document fields and three lists, and nothing else', () => {
    const R = RULES_SRC;
    ok(/exists\(memberPath\(me\(\)\)\)/.test(R), 'only somebody who has joined');
    ok(/request\.resource\.data\.diff\(resource\.data\)\.affectedKeys\(\)\s*\n?\s*\.hasOnly\(\['state', 'rev', 'updatedAt'\]\)/.test(R),
      'the document may change only state, rev and updatedAt — which pins owner, name, game, schema AND setup in one expression');
    ok(/request\.resource\.data\.state\.diff\(resource\.data\.state\)\.affectedKeys\(\)\s*\n?\s*\.hasOnly\(\['players', 'teams', 'tombstones'\]\)/.test(R),
      'and state only players, teams and tombstones — pinning league whole, settings included');
    ok(/request\.resource\.data\.rev == resource\.data\.rev \+ 1/.test(R), 'every update is still a transaction');
  });

  /* ── The claim ──────────────────────────────────────────────────────────
     Exclusive both ways. One half is the roster subcollection, whose document
     id IS the player; the other is the member document, which has one
     playerId field. What is enforced only by AGREEMENT is that the two name
     each other — so `claim` is the confirmed reading and `playerId` is only
     what was asked for. */
  group('one account, one player, both ways');

  t('reconcileClaims confirms a link only when the roster agrees', () => {
    const mem = [{ uid: 'u1', playerId: 'p1' }, { uid: 'u2', playerId: 'p2' }, { uid: 'u3', playerId: null }];
    H.reconcileClaims(mem, [{ playerId: 'p1', uid: 'u1' }]);
    eq(mem.map((m) => m.claim), ['p1', null, null], 'a member document alone claims nothing');
  });

  t('two accounts naming one player claim nobody but the holder', () => {
    const mem = [{ uid: 'u1', name: 'One', playerId: 'p1' }, { uid: 'u2', name: 'Two', playerId: 'p1' }];
    H.reconcileClaims(mem, [{ playerId: 'p1', uid: 'u2' }]);
    /* The live league was in exactly this state. memberForPlayer used .find
       on playerId, and .find cannot express a conflict — it silently picked
       one, and availFor read that one's answers. */
    eq(H.memberForPlayer(mem, 'p1').name, 'Two', 'the holder, and not whoever the snapshot listed first');
    eq(mem[0].claim, null, 'the other reads as unclaimed everywhere');
    const st = H.normalizeLeague(teamsFixture());
    mem[0].avail = { '2026-09-10': 'y' };
    mem[1].avail = { '2026-09-10': 'n' };
    eq(H.availFor(st, mem, 'p1', '2026-09-10'), { answer: 'n', source: 'player' }, 'and the holder is whose answer counts');
  });

  t('a rename is not theirs unless the roster says so', () => {
    const st = H.normalizeLeague(teamsFixture());
    eq(H.requestVerdict(st, [{ uid: 'u1', playerId: 'p1', claim: null }], { uid: 'u1', playerId: 'p1', name: 'X' }, []),
      'not-theirs', 'a link the roster has not confirmed entitles them to nothing');
    eq(H.requestVerdict(st, [{ uid: 'u1', playerId: 'p1', claim: 'p1' }], { uid: 'u1', playerId: 'p1', name: 'X' }, []), 'apply');
  });

  t('claiming a held player is taken, and claiming your own is already', () => {
    const st = H.normalizeLeague(teamsFixture());
    const free = [{ uid: 'u1', claim: null }];
    eq(H.requestVerdict(st, free, { uid: 'u1', claim: 'p1' }, []), 'apply');
    eq(H.requestVerdict(st, free, { uid: 'u1', claim: 'p1' }, [{ playerId: 'p1', uid: 'u9' }]), 'taken');
    eq(H.requestVerdict(st, [{ uid: 'u1', claim: 'p1' }], { uid: 'u1', claim: 'p1' }, [{ playerId: 'p1', uid: 'u1' }]), 'already');
    eq(H.requestVerdict(st, [{ uid: 'u1', claim: 'p2' }], { uid: 'u1', claim: 'p1' }, []), 'taken',
      'and an account that is already somebody cannot become a second person');
    eq(H.requestVerdict(st, free, { uid: 'u1', claim: 'nobody' }, []), 'gone');
  });

  t('the roster is create-only, and its document id is the player', () => {
    const R = RULES_SRC;
    ok(/match \/roster\/\{playerId\}/.test(R), 'the collection is keyed by the player');
    ok(/allow update: if false;/.test(R), 'create-only: a swap is never one write that could half-succeed into a lie');
    ok(/hasOnly\(\['uid', 'at'\]\)/.test(R), 'two fields and no more');
    ok(/get\(memberPath\(claimant\(\)\)\)\.data\.playerId == playerId/.test(R),
      'the agreement is checked against the CLAIMANT’s member document, which is what folds the admin case into one term');
    ok(/\(claimant\(\) == me\(\) \|\| isOwner\(\) \|\| memberIsAdmin\(\)\)/.test(R), 'and separately, who may act');
    ok(/allow delete: if signedIn\(\) && \(resource\.data\.uid == me\(\) \|\| isOwner\(\) \|\| memberIsAdmin\(\)\)/.test(R),
      'the holder or an admin may free a name');
  });

  t('the members rule widens by exactly one field', () => {
    const R = RULES_SRC;
    ok(/memberIsAdmin\(\)\s*\n?\s*&& request\.resource\.data\.diff\(resource\.data\)\.affectedKeys\(\)\.hasOnly\(\['playerId'\]\)/.test(R),
      'an admin may say which player an account is and nothing else — stronger than three equalities, because it covers joinedAt and refuses a new key');
    ok(/\(me\(\) == uid && request\.resource\.data\.role == resource\.data\.role\)/.test(R), 'the self-update branch is untouched');
    ok(/isOwner\(\)\s*\n\s*\|\| \(me\(\) == uid/.test(R), 'and so is the owner’s');
  });

  t('switching is delete then create, and every half-written state reads as unclaimed', () => {
    const src = stripComments(APP_SRC);
    const fn = src.slice(src.indexOf('async function claimPlayer'), src.indexOf('async function claimPlayer') + 1200);
    ok(fn.length > 300, 'claimPlayer was found');
    const del = fn.indexOf('deleteDoc(rosterRef(id, was))');
    const upd = fn.indexOf('updateDoc(memberRef(id, user.uid)');
    const set = fn.indexOf('setDoc(rosterRef(id, next)');
    ok(del !== -1 && upd !== -1 && set !== -1, 'all three writes are there');
    ok(del < upd && upd < set, 'and in the one order where nothing intermediate is a lie', [del, upd, set].join(' '));
    ok(!/function linkPlayer/.test(src), 'linkPlayer is gone — nothing about this is a single field any more');
  });

  t('a losing claim lets go on what the roster SHOWS, never on a refusal', () => {
    const src = stripComments(APP_SRC);
    /* To the function's OWN closing brace. A fixed slice ran past the end of
       this one and into a neighbour that does call setSyncError, so the
       negative below was about the wrong code. */
    const body = (name) => {
      const at = src.indexOf(name);
      if (at === -1) return '';
      const end = src.indexOf('\n}', at);
      return end === -1 ? '' : src.slice(at, end);
    };
    const adopt = body('async function adoptClaim');
    ok(adopt.length > 200, 'adoptClaim was found');
    ok(!/setSyncError/.test(adopt), 'a refusal is not a fault — every account would see Not syncing on the same afternoon');
    /* A permission-denied means EITHER somebody beat us to the row OR the
       rules are not published yet, and the client cannot tell those apart.
       Only one is a reason to un-link an account, so neither does. */
    ok(!/deleteField/.test(adopt), 'and it must NOT drop the link on a refusal it cannot read');
    const reap = body('async function reapMyRoster');
    ok(reap.length > 200, 'reapMyRoster was found');
    ok(/holder && holder\.uid !== user\.uid/.test(reap), 'letting go is driven by a row that names somebody else');
    ok(/playerId: F\.deleteField\(\)/.test(reap), 'and only then');
  });

  t('a name nobody holds can be taken back, even with a row left behind', () => {
    const src = stripComments(APP_SRC);
    const body = (name) => {
      const at = src.indexOf(name);
      const end = at === -1 ? -1 : src.indexOf('\n}', at);
      return end === -1 ? '' : src.slice(at, end);
    };
    const fn = body('async function claimPlayer');
    ok(fn.length > 400, 'claimPlayer was found');
    /* THE BUG: the roster is create-only, so a setDoc onto a row that already
       exists is an UPDATE, and `allow update: if false` refuses it. A row left
       behind by a race therefore made a name permanently unclaimable — and
       said it belonged to somebody else. */
    ok(/window\.lnHolderOf\(next\)/.test(fn), 'it asks who CONFIRMEDLY holds the name — a row alone is not a holder');
    ok(/some\(\(r\) => r\.playerId === next\)[\s\S]{0,200}deleteDoc\(rosterRef\(id, next\)\)/.test(fn),
      'and clears a leftover at the target before creating, or the create is refused as an update');
    ok(fn.indexOf('lnHolderOf(next)') < fn.indexOf('deleteDoc(rosterRef(id, next))'),
      'in that order: it never deletes a row somebody legitimately holds');
    ok(!/Somebody else is down as that player[\s\S]{0,80}permission-denied/.test(fn),
      'and a refusal it cannot explain does NOT claim somebody else has the name');
  });

  t('adoption stops the moment somebody says for themselves who they are', () => {
    const src = stripComments(APP_SRC);
    ok(/claimSettled\.add\(id\)/.test(src), 'claimPlayer settles the league');
    ok(/if \(!user \|\| claimAdopted\.has\(id\) \|\| claimSettled\.has\(id\)\) return;/.test(src),
      'and adoptClaim never speaks again — un-claiming raced its own listeners, and adoption put the row straight back');
  });

  t('a league that goes takes its roster with it, and so does a member who leaves', () => {
    const src = APP_SRC;
    ok(/const rosterRef = \(id, playerId\) => F\.doc\(db, 'leagues', id, 'roster', playerId\)/.test(src), 'there is a ref');
    ok(/getDocs\(F\.collection\(db, 'leagues', id, 'roster'\)\)[\s\S]{0,400}rost\.forEach\(\(d\) => batch\.delete\(d\.ref\)\)/.test(src),
      'deleteLeague takes the roster in the SAME batch — a league deleted first leaves every row undeletable for good');
    ok(/async function leaveLeague[\s\S]{0,500}deleteDoc\(rosterRef\(id, meDocLocal\.playerId\)\)/.test(src), 'leaving frees your name');
    ok(/async function removeMember[\s\S]{0,500}deleteDoc\(rosterRef\(id, held\.playerId\)\)/.test(src), 'and so does being removed');
  });

  t('a claim request reaches applyRequest, which writes the member document first', () => {
    const src = stripComments(APP_SRC);
    ok(/\(!\('claim' in d\)\s*\|\| \(d\.claim is string && d\.claim\.size\(\) <= 64\)\)/.test(RULES_SRC), 'the rules carry it');
    ok(/if \(r\.claim\) return await window\.lnCloud\.assign\(r\.uid, r\.claim\)/.test(src), 'applyRequest routes it to assign');
    const fn = src.slice(src.indexOf('async function assign'), src.indexOf('async function assign') + 800);
    ok(fn.indexOf('updateDoc(memberRef(id, uid)') < fn.indexOf('setDoc(rosterRef(id, playerId)'),
      'and assign writes the member document BEFORE the row — the roster rule reads it, so the other order is simply refused');
  });

  t('lnCleanRequest keeps a claim and drops one that is not an id', () => {
    ok(W.lnCleanRequest('u1', { at: 1, claim: 'p1' }), 'a claim alone is a request');
    eq(W.lnCleanRequest('u1', { at: 1, claim: 'p1' }).claim, 'p1');
    eq(W.lnCleanRequest('u1', { at: 1 }), null, 'and an ask for nothing is not');
    eq(W.lnCleanRequest('u1', { at: 1, claim: 'not an id!' }), null, 'a claim that is not an id shape is no claim');
    eq(W.lnCleanRoster('p1', { uid: 'abc' }), { playerId: 'p1', uid: 'abc' });
    eq(W.lnCleanRoster('p1', { uid: '' }), null, 'a row naming nobody is not a row');
    eq(W.lnCleanRoster('bad id!', { uid: 'abc' }), null, 'nor one keyed by something that is not an id');
  });

  /* ── The guards ─────────────────────────────────────────────────────── */
  group('the caps, and what to do when they bite');

  t('the rules cap what one league may hold', () => {
    const R = RULES_SRC;
    ok(/function validSize\(s\)/.test(R), 'there is a size function at all');
    const cap = (k) => { const m = R.match(new RegExp('s[.]' + k + '[.]size[(][)]\\s*<=\\s*(\\d+)')); return m ? Number(m[1]) : null; };
    eq([cap('players'), cap('teams'), cap('seasons'), cap('matches'), cap('brackets'), cap('tombstones')],
      [500, 250, 100, 2000, 200, 2000], 'the six caps, pinned so a silent change fails here');
    ok(R.indexOf('d.state is map') < R.indexOf('validSize(d.state)'),
      'and `is map` comes first — size() on a non-list is an evaluation error');
  });

  t('the leagues cap is client-side, and says so in both places', () => {
    const src = APP_SRC;
    ok(/const LEAGUES_MAX = 20;/.test(src), 'twenty');
    ok(/async function shareLeague\(\)[\s\S]{0,200}tooManyLeagues\(\)/.test(src), 'checked before a share');
    ok(/async function joinLeague\([\s\S]{0,200}tooManyLeagues\(\)/.test(src), 'and before a join');
    ok(/speed bump/.test(src), 'and the comment is honest about what it is');
    ok(/enforced in the browser only/.test(README_SRC), 'as is the README');
  });

  t('the README carries the incident runbook', () => {
    const R = README_SRC;
    ok(/## If something goes wrong/.test(R), 'there is a runbook');
    ok(/league-night-dff31/.test(R), 'it names the project');
    ok(/kill switch/.test(R), 'and says the rules are the kill switch');
    ok(/roster/.test(R) && /disputed claim/i.test(R), 'and where to look at a disputed claim');
  });

  /* ── The new windows ────────────────────────────────────────────────── */
  group('the new windows are the family’s shape');

  t('the Team Setup card is the family’s shape', () => {
    const D = W.document;
    const card = D.getElementById('setupCard');
    ok(card, 'it exists');
    ok(card.classList.contains('cloud-only'), 'cloud-only, so a local league and a shared snapshot never see it');
    eq(card.querySelector('h2').firstChild.textContent.trim(), 'Team Setup', 'Title Case, and the heading is the name');
    const dots = card.querySelectorAll('.tile-help');
    eq(dots.length, 1, 'one dot for one heading');
    eq(dots[0].textContent.trim(), 'i', 'and it is an i, never a question mark');
    ok(card.querySelector('p.lede'), 'a lede that says what it does');
    eq(card.querySelectorAll('input[type="text"]').length, 0, 'and no free text anywhere in it');
    ok(H.esc && typeof W.HELP === 'undefined' ? true : true);
  });

  t('Who They Are closes on a click outside and offers no free text', () => {
    const D = W.document;
    const src = APP_SRC;
    ok(/'searchDialog', 'assignDialog'\]\.forEach\(\(id\) => closeOnBackdropClick/.test(src),
      'registered for click-outside, or the backdrop would be dead for this one window alone');
    const dlg = D.getElementById('assignDialog');
    ok(dlg, 'it exists');
    eq(dlg.querySelectorAll('input[type="text"], textarea').length, 0, 'one select and nothing to type into');
    ok(dlg.querySelector('select#as_player'), 'and the select is there');
    ok(dlg.textContent.trim().length > 10, 'with static text, so the blind open-and-close walk does not read it as empty');
  });

  group('installable, and it works offline');
  t('the manifest is valid, and its scope is relative', () => {
    const m = JSON.parse(MANIFEST_SRC);
    eq(m.scope, './'); eq(m.start_url, './'); eq(m.display, 'standalone'); eq(m.name, 'League Night');
    ok(/<link rel="manifest" href="manifest\.webmanifest">/.test(APP_SRC));
    eq(m.icons.map(i => i.purpose).sort(), ['any', 'any', 'maskable']);
    ok(!/rel="manifest"/.test(PRIVACY_SRC));
  });
  t('the worker is network-first, and caches only public files', () => {
    ok(/networkFirst/.test(SW_SRC));
    const swCode = stripComments(SW_SRC);
    ok(/fetch\(req, \{ cache: 'no-cache' \}\)/.test(swCode) && !/fetch\(req\)/.test(swCode));
    ok(!/eval\(|importScripts|import\(/.test(SW_SRC));
    eq(SW_SRC.match(/https?:\/\/[^\s'"]+/g) || [], []);
  });
  t('the SHELL list is pinned here, which is the security review', () => {
    const arr = (SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/) || [])[1] || '';
    eq((arr.match(/'([^']+)'/g) || []).map(s => s.replace(/'/g, '')),
       ['./', 'theme.css', 'privacy.html', 'favicon.ico', 'manifest.webmanifest', 'icon-192.png', 'icon-512.png', 'icon-512-maskable.png']);
  });
  t('activate deletes only THIS app’s caches, and the kill switch exists', () => {
    ok(/k\.startsWith\(PREFIX\)/.test(SW_SRC) && /ln-shell-/.test(SW_SRC));
    ok(/registration\.unregister/.test(KILL_SRC) && /ln-shell-/.test(KILL_SRC) && /clients\.matchAll/.test(KILL_SRC));
  });
  t('registration is guarded three ways', () => {
    const reg = (APP_SRC.match(/serviceWorker' in navigator[\s\S]*?\}\)\(\);/) || [''])[0];
    ok(/window\.top !== window\.self/.test(reg) && /window\.lnViewOnly/.test(reg) && /addEventListener\('load'/.test(reg));
  });
  t('the icon is the same picture in both places', () => {
    ok(/circle cx='32' cy='32' r='21'/.test(APP_SRC) && /favicon\.ico\?v=2/.test(APP_SRC), 'the inline SVG is the dartboard, and the ico reference was bumped');
  });
}

function run() {
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      const td = document.createElement('td');
      td.colSpan = 3; td.textContent = item.group;
      tr.appendChild(td); out.appendChild(tr);
      continue;
    }
    let err = null;
    try { item.fn(); } catch (e) { err = e; }
    const tr = document.createElement('tr');
    tr.className = err ? 'fail' : 'pass';
    const st = document.createElement('td');
    st.className = 'st'; st.textContent = err ? '✕' : '✓';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td');
    msg.className = 'msg'; msg.textContent = err ? err.message : '';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    if (err) fail++; else pass++;
  }
  /* The floor — see EXPECTED at the top. Written as a row of its own so it reads
     like any other failure, and counted into `fail` so CI's "All N tests pass"
     check cannot match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '✕';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least ' + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here would '
      + 'cover a fraction of the suite. If they were retired on purpose, lower EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? 'All ' + pass + ' tests pass' : fail + ' of ' + (pass + fail) + ' tests FAILED';
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}

main().catch((e) => {
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = 'The suite could not start: ' + e.message;
});
