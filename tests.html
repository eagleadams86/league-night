<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- frame-src 'self' is what lets the hidden iframe below load index.html.
     Without it the frame is refused by default-src and the suite reports that
     the app exposed no hooks — which reads as an app bug and is a CSP one. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Night — Tests</title>
<style>
  /* Dev-only page. Colours are Midnight from the theme pack, HARD-CODED on
     purpose: this page must keep working when theme.css is the thing that
     broke, so it is the one file here that does not link it. */
  body { background: #0a0e1a; color: #e7eaf6; margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #838cab; font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid #262f4a; background: #121829; }
  #summary.ok  { color: #72fe84; border-color: #72fe84; }
  #summary.bad { color: #fb7874; border-color: #fb7874; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid #262f4a; vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: #72fe84; }
  tr.fail td.st { color: #fb7874; }
  tr.fail td.msg { color: #fb7874; }
  .msg { color: #838cab; font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: #838cab; border-bottom-color: #374163; }
</style>
</head>
<body>
<div class="wrap">
  <h1>League Night — Tests</h1>
  <p class="sub">Loads the real index.html in a hidden iframe and calls its functions directly
    — no copies, no build step, so a test cannot drift from the code it tests. Read-only:
    nothing here writes to storage.</p>
  <div id="summary">Loading…</div>
  <table><tbody id="out"></tbody></table>
</div>

<script>
'use strict';

/* ── The completeness floor ────────────────────────────────────────────────
   Every tests.html in this family pins the number of tests it expects to RUN.
   Removing a test fails the build; adding one never does. Without it, tests that
   go MISSING look exactly like tests that pass — a suite that quietly shrank to
   three checks still says "all 3 tests pass". RAISE THIS when you add tests, and
   lower it only when you retire one deliberately. */
const EXPECTED = 171;

/* ── It refuses to run anywhere but localhost, and that is load-bearing ──────
   GitHub Pages publishes this page BESIDE the app, where the iframe below would
   be the reader's real, saved copy — and booting the app IS the side effect, so
   the check cannot live in the load handler. `file://` is deliberately NOT in
   this list: it has no hostname, and treating '' as local sends the page down
   the iframe branch, where the frame silently fails to load and the suite blames
   the app for what is a setup problem. */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

/* Bust the frame AND the source fetches. They are different caches and they can
   disagree: in the lottery repo this same harness once reported ALL GREEN
   against a page three features out of date, because the source-level tests read
   the file off the server while the frame ran a copy the browser had cached.
   Nothing errored; the new code was simply never run. A suite that can pass
   against a build which exists nowhere is worse than no suite — it turns
   "untested" into "verified". */
const BUST = '?t=' + Date.now();
const bustFetch = (path) => fetch(path + BUST, { cache: 'no-store' });

const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name: name, fn: fn }); }
/* `detail` is the value that FAILED, not more prose: `ok(w <= pin, 'it fits',
   w + 'px')` says what was expected and then shows what was actually there.
   Every suite in the family takes three arguments now (2026-08-26). It was two
   here, and a call site passing a third had its diagnostic silently dropped —
   the assertion still failed correctly, it just refused to say what it saw.
   CodeQL's js/superfluous-trailing-arguments caught it three separate times in
   one day, in three different repos, which is what settled the signature. */
function ok(cond, note, detail) {
  if (cond) return;
  throw new Error((note || 'expected truthy')
    + (detail === undefined ? '' : ' \u2014 got ' + detail));
}
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((note ? note + ' — ' : '') + 'got ' + a + ', wanted ' + b);
}
/* A loop, not a single .replace(): one pass over a multi-character delimiter can
   leave a NEW opener behind that the pass has already gone past. CodeQL flags the
   single-pass version and it was open on five of the nine public repos at once.
   Nothing here renders what it strips — the reason to fix it is that a helper
   which can be fooled about what is commented out is one that can miss a live
   off-origin script, which is what these suites exist to catch. */
/* The text a READER sees, tags removed. Deliberately a scanner and not
   `replace(/<[^>]+>/g, '')`: a single-pass tag strip is the shape CodeQL flags as
   incomplete multi-character sanitization, and it is right to — one pass over
   `<<p>p>` leaves a live tag behind. Nothing here is rendered, so the bug that
   shape would cause here is only a wrong CHARACTER COUNT, but the alert it raises
   is a real High sitting open on the security tab, where a true finding would be
   missed among it. Callers normalise whitespace themselves, as they did before. */
function visibleText(html) {
  let out = '', inTag = false;
  for (const ch of html) {
    if (ch === '<') { inTag = true; continue; }
    if (ch === '>') { inTag = false; continue; }
    if (!inTag) out += ch;
  }
  return out;
}

function stripComments(src) {
  let out = src, prev;
  do { prev = out; out = out.replace(/\/\*[\s\S]*?\*\//g, '').replace(/<!--[\s\S]*?-->/g, ''); }
  while (out !== prev);
  return out;
}

let W = null, H = null;
let APP_SRC = '', PRIVACY_SRC = '', THEME_SRC = '', SW_SRC = '', KILL_SRC = '', MANIFEST_SRC = '', RULES_SRC = '';

async function main() {
  if (LOCAL_HOSTS.indexOf(location.hostname) === -1) {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'This suite only runs on http://localhost — it boots the real app in a '
      + 'frame, which must never happen on the published site. Serve this folder and open '
      + 'http://localhost:<port>/tests.html';
    return;
  }

  APP_SRC      = await (await bustFetch('index.html')).text();
  PRIVACY_SRC  = await (await bustFetch('privacy.html')).text();
  THEME_SRC    = await (await bustFetch('theme.css')).text();
  SW_SRC       = await (await bustFetch('sw.js')).text();
  KILL_SRC     = await (await bustFetch('sw-kill.js')).text();
  MANIFEST_SRC = await (await bustFetch('manifest.webmanifest')).text();
  RULES_SRC    = await (await bustFetch('firestore.rules')).text();

  /* ── Guard the source actually loaded, BEFORE any negative assertion ───────
     An all-NOT test over a fetched file proves nothing when the fetch failed:
     every "must not contain" passes on an empty string, and the suite goes green
     having read nothing. */
  ok(APP_SRC.length > 2000, 'index.html did not load — every check below would pass on an empty string');
  ok(PRIVACY_SRC.length > 500, 'privacy.html did not load');
  ok(THEME_SRC.length > 2000, 'theme.css did not load — is it beside these files?');
  ok(SW_SRC.length > 500, 'sw.js did not load');
  ok(KILL_SRC.length > 100, 'sw-kill.js did not load — the escape hatch has to exist BEFORE it is needed');
  ok(MANIFEST_SRC.length > 100, 'manifest.webmanifest did not load');
  ok(RULES_SRC.length > 500, 'firestore.rules did not load');

  W = await bootApp();
  H = W.__lnTestHooks;
  define();
  await runAsync();
  run();
}

function bootApp() {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe');
    frame.title = 'app under test';
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('data-ln-tests', '');
    frame.style.cssText = 'position:absolute;width:1000px;height:800px;left:-9999px;top:0';
    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      /* Wrapped: reading a property of a frame the CSP refused throws a
         SecurityError, and an uncaught one here never reaches the catch below —
         the suite then sits on "Loading…" saying nothing at all. */
      let hooks = null;
      try { hooks = win && win.__lnTestHooks; } catch (e) { hooks = null; }
      if (hooks) { resolve(win); return; }
      let booted = false, blocked = false;
      try { booted = !!(win.document && win.document.getElementById('standingsWrap')); }
      catch (e) { blocked = true; }
      reject(new Error(blocked
        ? 'the frame could not be read at all — this page’s CSP needs frame-src \'self\'.'
        : booted
          ? 'index.html loaded but exposed no __lnTestHooks — did something throw while '
            + 'it was starting up? Check the browser console.'
          : 'The hidden frame never loaded index.html — is it being served?'));
    }, { once: true });
    frame.src = 'index.html' + BUST;   /* set before append: one load event, the real one */
    document.body.appendChild(frame);
  });
}

/* ── A SECOND frame, booted as somebody else's snapshot ──────────────────────
   The only honest way to test a shared view: `viewOnly` is decided from the
   URL before anything renders and there is no hook that flips it — a flag a
   test can set is a flag a bug can set. So this boots the real app at a real
   '#share=' link, and polls for the banner because `load` fires before boot()
   has awaited decodeShare(). */
function bootFrame(hash, width, height) {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe');
    frame.title = 'app under test, ' + (hash ? 'as a shared snapshot' : 'at ' + width + 'px');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('data-ln-tests', '');
    frame.style.cssText = 'position:absolute;width:' + (width || 1000) + 'px;height:' + (height || 800) + 'px;left:-9999px;top:0';
    frame.src = 'index.html' + BUST + (hash || '');
    document.body.appendChild(frame);
    const started = Date.now();
    const poll = () => {
      let win = null, ready = false;
      try {
        win = frame.contentWindow;
        if (hash) { const bar = win.document.getElementById('viewbar'); ready = !!(win.lnViewOnly && bar && !bar.hidden); }
        else ready = !!win.__lnTestHooks;
      } catch (e) { /* not readable yet */ }
      if (ready) { resolve(win); return; }
      if (Date.now() - started > 15000) { reject(new Error('the frame never finished booting')); return; }
      setTimeout(poll, 40);
    };
    poll();
  });
}

/* The async checks run up front and their VERDICTS are recorded, so a test
   body stays a plain function that either throws or doesn't. */
const asyncResults = {};
async function runAsync() {
  /* ── The render smoke test ─────────────────────────────────────────────
     Plant each demo league, visit every tab, open and close every dialog,
     and record anything the frame throws. It cannot tell a right figure from
     a wrong one; it is the difference between "the maths is right" and "the
     app runs". */
  try {
    const errs = [];
    W.addEventListener('error', (e) => errs.push(String(e.message)));
    W.addEventListener('unhandledrejection', (e) => errs.push('unhandled rejection: ' + e.reason));
    const drawn = {};
    const doc = W.document;
    const walk = (prefix) => {
      for (const tab of H.TABS) {
        const btn = doc.getElementById('tab-' + tab);
        if (!btn) { errs.push('no tab button for ' + tab); continue; }
        btn.click();
        const panel = doc.getElementById(btn.getAttribute('aria-controls'));
        drawn[prefix + tab] = panel ? panel.textContent.trim().length : 0;
      }
    };
    H.__plant(H.buildDemoSingles());
    walk('tab:');
    /* The scorer, the player editor and the bracket builder fill themselves
       from a record, so open each on one before the blind open/close pass. */
    doc.getElementById('tab-matches').click();
    doc.querySelector('#matchesWrap .mrow').click(); doc.getElementById('matchDialog').close();
    doc.getElementById('tab-players').click();
    doc.querySelector('#playersWrap .prow').click(); doc.getElementById('playerDialog').close();
    doc.getElementById('tab-tournament').click();
    doc.getElementById('addBracketBtn').click(); doc.getElementById('bracketDialog').close();
    doc.getElementById('scheduleBtn').hidden || (doc.getElementById('scheduleBtn').click(), doc.getElementById('scheduleDialog').close());
    doc.getElementById('shareBtn').click(); doc.getElementById('shareDialog').close();
    doc.getElementById('tab-' + H.TABS[0]).click();
    const dialogs = [...doc.querySelectorAll('dialog')].filter((d) => d.id);
    for (const d of dialogs) {
      try { d.showModal(); drawn['dialog:' + d.id] = d.textContent.trim().length; d.close(); }
      catch (e) { errs.push('dialog ' + d.id + ': ' + e.message); }
    }
    H.__plant(H.buildDemoTeams());
    walk('teams:');
    doc.getElementById('tab-matches').click();
    doc.querySelector('#matchesWrap .mrow').click(); doc.getElementById('matchDialog').close();
    doc.getElementById('tab-standings').click();
    doc.querySelector('#stModeWrap [data-mode="players"]').click();
    drawn['teams:individual'] = doc.getElementById('standingsWrap').textContent.trim().length;
    doc.querySelector('#stModeWrap [data-mode="sides"]').click();
    doc.getElementById('tab-players').click();
    doc.querySelector('#teamsWrap .prow').click(); doc.getElementById('teamDialog').close();
    asyncResults.smoke = { errs: errs, drawn: drawn, dialogs: dialogs.length };
  } catch (e) { asyncResults.smoke = { errs: ['the walk itself threw: ' + e.message], drawn: {}, dialogs: 0 }; }
  try { H.__plant(FIXTURE); W.setTab('standings'); } catch (e) { /* reported by the walk's own verdict */ }

  try {
    const payload = H.buildSharePayload(H.normalizeLeague(FIXTURE), {});
    const token = await H.encodeShare(payload);
    asyncResults.roundTrip = { token: token, back: await H.decodeShare(token) };
  } catch (e) { asyncResults.roundTrip = { error: e.message }; }
  try { await H.decodeShare('9.AAAA'); asyncResults.badMarker = 'no error'; } catch (e) { asyncResults.badMarker = e.message; }
  try {
    await H.decodeShare(await H.encodeShare({ v: H.SHARE_PAYLOAD_V + 1, league: {}, matches: [] }));
    asyncResults.newer = { thrown: false };
  } catch (e) { asyncResults.newer = { thrown: true, flagged: !!e.newerVersion }; }

  /* ── The shared view, in a frame of its own ───────────────────────────── */
  try {
    const S = await bootFrame('#share=' + await H.encodeShare(H.buildSharePayload(H.normalizeLeague(FIXTURE), {})));
    const SD = S.document;
    SD.getElementById('tab-matches').click();
    asyncResults.shared = {
      banner: !SD.getElementById('viewbar').hidden,
      readonly: SD.documentElement.hasAttribute('data-readonly'),
      leagueId: S.__lnTestHooks.__state().league.id,
      noAddMatch: SD.getElementById('addMatchBtn').hidden,
      noScore: !SD.querySelector('.mrow .mgo'),
      rows: (SD.getElementById('tab-standings').click(), SD.querySelectorAll('#standingsTable tbody tr').length),
    };
  } catch (e) { asyncResults.shared = { error: e.message }; }

  /* ── A phone-sized frame: the bar, the sheet, no sideways scroll ────────
     Measured in a 375x812 frame, because a media query answers the frame it
     is in and nothing about the bar can be seen at 1000px. */
  try {
    const P = await bootFrame('', 375, 812);
    const PD = P.document;
    P.__lnTestHooks.__plant(P.__lnTestHooks.buildDemoSingles());
    const bar = PD.querySelector('.tabbar');
    const r = {
      vw: P.innerWidth, vh: P.innerHeight,
      barDisplay: P.getComputedStyle(bar).display,
      tabsDisplay: P.getComputedStyle(PD.querySelector('.tabs')).display,
      barBottom: Math.round(bar.getBoundingClientRect().bottom),
      padBottom: parseFloat(P.getComputedStyle(PD.body).paddingBottom),
    };
    PD.getElementById('tab-matches').click();
    PD.querySelector('#matchesWrap .mrow').click();
    r.sheetW = Math.round(PD.getElementById('matchDialog').getBoundingClientRect().width);
    r.barUnderDialog = P.getComputedStyle(bar).display;
    PD.getElementById('matchDialog').close();
    ['standings', 'matches', 'players', 'tournament', 'league'].forEach((tab) => PD.getElementById('tab-' + tab).click());
    r.noSideways = PD.documentElement.scrollWidth <= P.innerWidth + 1;
    asyncResults.phone = r;
  } catch (e) { asyncResults.phone = { error: e.message }; }

  /* ── Where a press leaves the page ─────────────────────────────────────── */
  try {
    const D = W.document;
    const pause = (ms) => new Promise((r) => setTimeout(r, ms));
    const settle = async (y) => { W.scrollTo(0, y); await pause(80); return W.scrollY; };
    const press = async (t) => { D.getElementById('tab-' + t).click(); await pause(120); };
    H.__plant(H.buildDemoSingles());
    await pause(150);
    await press('matches');
    const down = await settle(400);
    await press('players');
    const afterOtherTab = W.scrollY;
    await press('matches');
    const held = await settle(400);
    await press('matches');
    const afterSameTab = W.scrollY;
    asyncResults.landing = { down: down, afterOtherTab: afterOtherTab, held: held, afterSameTab: afterSameTab };
  } catch (e) { asyncResults.landing = { error: e.message }; }
  try { H.__plant(FIXTURE); W.setTab('standings'); } catch (e) { /* reported by the verdict above */ }
}

/* ── The suite plants what it needs, and never trusts what it finds ──────────
   A fixed league, not the demo: the demo's dates count back from today, so an
   assertion on an order would drift, and the point of a fixture is that it
   cannot. Four players, one season, three results and a fixture still to
   play — enough for a table to have something to say. */
const FIXTURE = {
  schema: 1,
  league: { id: 'LN-FIXTURE1', name: 'Fixture League', game: 'darts', createdAt: '2026-01-01', u: 1,
            settings: { format: 'singles', teamSize: 2, legFormat: '501', dOut: true,
                        matchFormat: { mode: 'bestOf', n: 3 }, points: { win: 2, draw: 1, loss: 0 },
                        tiebreak: ['pts', 'legDiff', 'legsFor', 'h2h', 'name'] } },
  players: [
    { id: 'fx-alpha', name: 'Alpha Thousands', teamId: null, hcp: null, active: true, u: 2 },
    { id: 'fx-bravo', name: 'Bravo Ordinary', teamId: null, hcp: 20, active: true, u: 3 },
    { id: 'fx-charlie', name: 'Charlie Negative', teamId: null, hcp: null, active: true, u: 4 },
    { id: 'fx-delta', name: 'Delta Retired', teamId: null, hcp: null, active: false, u: 5 },
  ],
  teams: [],
  seasons: [{ id: 'fx-season', name: 'Fixture Season', startsOn: '2026-01-05', status: 'active', u: 6 }],
  matches: [
    { id: 'fx-m1', seasonId: 'fx-season', bracketId: null, slot: null, round: 1, date: '2026-01-05', venue: 'The Crown',
      a: 'fx-alpha', b: 'fx-bravo', status: 'played', score: { a: 0, b: 0 },
      legs: [{ w: 'a', by: { a: ['fx-alpha'], b: ['fx-bravo'] }, start: { a: 501, b: 481 }, a: { darts: 18, checkout: 40 } },
             { w: 'a', by: { a: ['fx-alpha'], b: ['fx-bravo'] }, start: { a: 501, b: 481 }, a: { darts: 21, t180: 1 } }], u: 10 },
    { id: 'fx-m2', seasonId: 'fx-season', bracketId: null, slot: null, round: 1, date: '2026-01-05', venue: '',
      a: 'fx-charlie', b: 'fx-delta', status: 'played', score: { a: 0, b: 0 },
      legs: [{ w: 'b', by: { a: ['fx-charlie'], b: ['fx-delta'] }, start: { a: 501, b: 501 } },
             { w: 'a', by: { a: ['fx-charlie'], b: ['fx-delta'] }, start: { a: 501, b: 501 } },
             { w: 'b', by: { a: ['fx-charlie'], b: ['fx-delta'] }, start: { a: 501, b: 501 } }], u: 11 },
    { id: 'fx-m3', seasonId: 'fx-season', bracketId: null, slot: null, round: 2, date: '2026-01-12', venue: '',
      a: 'fx-alpha', b: 'fx-charlie', status: 'forfeit', score: { a: 2, b: 0 }, legs: [], u: 12 },
    { id: 'fx-m4', seasonId: 'fx-season', bracketId: null, slot: null, round: 2, date: '2026-01-12', venue: '',
      a: 'fx-bravo', b: 'fx-delta', status: 'scheduled', score: { a: 0, b: 0 }, legs: [], u: 13 },
  ],
  brackets: [],
  tombstones: [],
};
const M = (id, a, b, sa, sb, date, extra) => Object.assign({ id: id, a: a, b: b, status: 'played', score: { a: sa, b: sb }, legs: [], date: date, u: 1,
  seasonId: null, bracketId: null, slot: null, round: 0, venue: '' }, extra || {});
const RULES = { points: { win: 2, draw: 1, loss: 0 }, tiebreak: ['pts', 'legDiff', 'legsFor', 'h2h', 'name'] };
const bm = (slot, a, b, w, bracketId) => ({ id: 'bm-' + slot, bracketId: bracketId || 'b', slot: slot, a: a, b: b, status: 'played',
  score: { a: w === 'a' ? 2 : 0, b: w === 'b' ? 2 : 0 }, legs: [], u: 1, seasonId: null, round: 0, venue: '', date: null });
const css = () => (stripComments(APP_SRC).match(/<style>([\s\S]*?)<\/style>/) || [])[1] || '';

function define() {
  const booted = W.document.documentElement.hasAttribute('data-welcome')
              || !!W.document.getElementById('standingsTable');
  H.__plant(FIXTURE);
  W.setTab('standings');

  group('the suite plants its own data');
  t('the app booted without throwing — before the suite planted anything', () => {
    /* boot() is async: a throw inside it is a rejected promise the page
       survives with nothing drawn, and every test below runs AFTER the
       declarations it tripped on exist. Found 2026-09-07: a `let` the first
       render read was declared after boot(), the live page failed its first
       paint, and 170 tests stayed green. */
    ok(!W.__lnBootError, 'boot threw', W.__lnBootError);
    const src = stripComments(APP_SRC);
    ok(src.indexOf('let membersFor') < src.indexOf('\nboot()'), 'the cloud-side lets are declared before boot() runs');
  });
  t('the app is rendered from a FIXTURE, not from this browser’s saved copy', () => {
    ok(booted, 'the app booted into one of its two real states');
    eq(H.__state().players.length, 4, 'and the suite then planted its own four players');
    ok(W.document.getElementById('standingsTable'), 'so there is a table to read');
    const hook = (stripComments(APP_SRC).match(/__plant: function[\s\S]*?\n  \},/) || [''])[0];
    ok(hook, 'the plant hook must exist');
    ok(hook.indexOf('save()') === -1, 'plant must never write — this suite runs against the reader’s own copy');
  });

  /* ═══════════════════════════════════════════════════════════════════════
     THE FAMILY RULES. Each pins something that went wrong in this family at
     least once.
     ═══════════════════════════════════════════════════════════════════════ */
  group('the palette and type come from the pack, not from this page');
  t('no raw pixel font size anywhere in the app', () => {
    const body = stripComments(APP_SRC).replace(/font:16px\/1\.55 system-ui[^']*/g, '');
    const hits = (body.match(/font-size\s*:\s*[0-9.]+px/g) || []).concat(body.match(/font:\s*[0-9.]+px/g) || []);
    eq(hits, [], 'raw pixel sizes opt that text out of the reader’s own text-size setting');
  });
  t('no font stack of its own — --font-sans is the pack’s', () => {
    const body = stripComments(APP_SRC).replace(/font:16px\/1\.55 system-ui,[^']*/g, '');
    ok(!/-apple-system/.test(body), 'the family stack lives in --font-sans; a local copy drifts');
    ok(/var\(--font-sans\)/.test(APP_SRC), 'and the body shorthand must use it');
  });
  t('no literal colour inside the <style> block', () => {
    ok(css().length > 500, 'the style block was not found, so this check read nothing');
    eq(css().match(/#[0-9a-f]{3,8}\b/gi) || [], [], 'a colour is decided in the pack’s tokens.json or it is not decided');
  });

    const r = stripComments(RULES_SRC.replace(/\/\/[^\n]*/g, ''));
    ok(/allow list:\s*if false;/.test(r), 'leagues are never enumerable — the ID is a capability only while nobody can list them');
    ok(/allow get:\s*if signedIn\(\);/.test(r), 'any signed-in account may fetch a league by id');
    ok(/request\.resource\.data\.rev == resource\.data\.rev \+ 1/.test(r), 'every update raises rev by exactly one');

    ok(/request\.resource\.data\.role == 'admin' && keyMatches\(\)/.test(r), 'admin is claimed by matching the key');
    /* Every get() is guarded by an exists() on the same path. */
    /* A balanced-paren scan: get(memberPath(me())).data nests two deep. */
    const gets = [];
    for (let at = r.indexOf('get('); at !== -1; at = r.indexOf('get(', at + 4)) {
      if (/[\w.]/.test(r[at - 1] || '')) continue;
      let depth = 0, i = at + 3;
      for (; i < r.length; i++) { if (r[i] === '(') depth++; else if (r[i] === ')' && --depth === 0) break; }
      if (r.slice(i + 1, i + 6) === '.data') gets.push(r.slice(at + 4, i));
    }
    ok(gets.length >= 4, 'gets found: ' + gets.length);
    gets.forEach((p) => ok(r.indexOf('exists(' + p + ')') !== -1, 'unguarded get on ' + p));
    ok(!/match \/\{document=\*\*\}/.test(r), 'no catch-all');

  t('the info dot is the family circle and the help window is declared property by property', () => {

    ok(/\.tabbar \{ display: flex; position: fixed;/.test(mob));

    ok(/dialog\.sheet \{ position: fixed; inset: auto 0 0 0;/.test(mob), 'and the scorer is a sheet');
    ok(/env\(safe-area-inset-bottom\)/.test(mob) && /viewport-fit=cover/.test(APP_SRC), 'safe areas need viewport-fit');

    eq(r.barDisplay, 'flex'); eq(r.tabsDisplay, 'none');
    ok(r.barBottom <= r.vh + 1 && r.barBottom >= r.vh - 1, 'the bar sits on the bottom edge, got ' + r.barBottom + ' of ' + r.vh);
    ok(r.padBottom >= 56, 'the page is padded past it');
    ok(r.sheetW === r.vw, 'the scorer sheet is the full width: ' + r.sheetW + ' of ' + r.vw);

  t('coarse pointers get a taller control floor and thumb-sized winner buttons', () => {
    const coarse = (css().match(/@media \(pointer: coarse\) \{\s*:root \{ --control-h: 44px; \}[\s\S]*?\}/) || [''])[0];

    ok(/setAttribute\('data-welcome'/.test(head) && /location\.hash\.indexOf\('#share='\) !== 0/.test(head));

  t('Enter in the Find box opens the first hit', () => {
    const D = W.document;

  t('the COUNT is the live region, not the list, and ⌘K does not fight another dialog', () => {

  group('a CSV is a file that LEAVES the app');
  t('a cell that could be read as a formula is defused, a real number is not', () => {
    ok(H.csvCell('=SUM(A1:A9)').indexOf("'=") > -1);

    eq(H.csvCell('-3abc'), "'-3abc"); eq(H.csvCell('-5'), '-5'); eq(H.csvCell('a,b'), '"a,b"');

  t('the standings export reads the rendered table', () => {

  group('installable, and it works offline');
  t('the manifest is valid, and its scope is relative', () => {
    const m = JSON.parse(MANIFEST_SRC);
    eq(m.scope, './'); eq(m.start_url, './'); eq(m.display, 'standalone'); eq(m.name, 'League Night');
    ok(/<link rel="manifest" href="manifest\.webmanifest">/.test(APP_SRC));
    eq(m.icons.map(i => i.purpose).sort(), ['any', 'any', 'maskable']);

  t('the worker is network-first, and caches only public files', () => {
    ok(/networkFirst/.test(SW_SRC));
    const swCode = stripComments(SW_SRC);
    ok(/fetch\(req, \{ cache: 'no-cache' \}\)/.test(swCode) && !/fetch\(req\)/.test(swCode));
    ok(!/eval\(|importScripts|import\(/.test(SW_SRC));
    eq(SW_SRC.match(/https?:\/\/[^\s'"]+/g) || [], []);
  });
  t('the SHELL list is pinned here, which is the security review', () => {
    const arr = (SW_SRC.match(/const SHELL = \[([\s\S]*?)\]/) || [])[1] || '';
    eq((arr.match(/'([^']+)'/g) || []).map(s => s.replace(/'/g, '')),
       ['./', 'theme.css', 'privacy.html', 'favicon.ico', 'manifest.webmanifest', 'icon-192.png', 'icon-512.png', 'icon-512-maskable.png']);
  });
  t('activate deletes only THIS app’s caches, and the kill switch exists', () => {
    ok(/k\.startsWith\(PREFIX\)/.test(SW_SRC) && /ln-shell-/.test(SW_SRC));
    ok(/registration\.unregister/.test(KILL_SRC) && /ln-shell-/.test(KILL_SRC) && /clients\.matchAll/.test(KILL_SRC));
  });
  t('registration is guarded three ways', () => {
    const reg = (APP_SRC.match(/serviceWorker' in navigator[\s\S]*?\}\)\(\);/) || [''])[0];
    ok(/window\.top !== window\.self/.test(reg) && /window\.lnViewOnly/.test(reg) && /addEventListener\('load'/.test(reg));
  });
  t('the icon is the same picture in both places', () => {
    ok(/circle cx='32' cy='32' r='21'/.test(APP_SRC) && /favicon\.ico\?v=2/.test(APP_SRC), 'the inline SVG is the dartboard, and the ico reference was bumped');
  });
}

function run() {
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      const td = document.createElement('td');
      td.colSpan = 3; td.textContent = item.group;
      tr.appendChild(td); out.appendChild(tr);
      continue;
    }
    let err = null;
    try { item.fn(); } catch (e) { err = e; }
    const tr = document.createElement('tr');
    tr.className = err ? 'fail' : 'pass';
    const st = document.createElement('td');
    st.className = 'st'; st.textContent = err ? '✕' : '✓';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td');
    msg.className = 'msg'; msg.textContent = err ? err.message : '';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    if (err) fail++; else pass++;
  }
  /* The floor — see EXPECTED at the top. Written as a row of its own so it reads
     like any other failure, and counted into `fail` so CI's "All N tests pass"
     check cannot match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '✕';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least ' + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here would '
      + 'cover a fraction of the suite. If they were retired on purpose, lower EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? 'All ' + pass + ' tests pass' : fail + ' of ' + (pass + fail) + ' tests FAILED';
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}

main().catch((e) => {
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = 'The suite could not start: ' + e.message;
});
